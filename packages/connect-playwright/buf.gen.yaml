version: v2
# Deletes the directories specified in the `out` field for all plugins before running code generation.
clean: true
plugins:
  # You will need to adapt these values to your environment:
  # https://protobufes.com/reference/environments/
  - local: protoc-gen-es
    out: src/testdata/gen
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: testdata
